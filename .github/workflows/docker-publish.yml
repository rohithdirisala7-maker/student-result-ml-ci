name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rohithdirisala7-maker/student-result-prediction

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t student-result-prediction:ci .

      - name: Start test container
        run: docker run -d --name student-result-ci -p 5000:5000 student-result-prediction:ci

      - name: Wait for health endpoint
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          docker logs student-result-ci
          exit 1

      - name: Test prediction endpoint in container
        run: |
          response=$(curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)
          echo "$response"
          echo "$response" | grep -q '"prediction":"PASS"'

      - name: Stop test container
        if: always()
        run: docker rm -f student-result-ci || true

      - name: Log in to GitHub Container Registry
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested image
        run: |
          docker tag student-result-prediction:ci "$IMAGE_NAME:latest"
          docker tag student-result-prediction:ci "$IMAGE_NAME:sha-${{ github.sha }}"

      - name: Publish tested image to GHCR
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-${{ github.sha }}"
